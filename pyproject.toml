[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xbgears"
version = "0.3.0"
authors = [
    { name = "aaronchh", email = "aaronhsu219@gmail.com" },
]
description = "A collection of tools for XBeach: grid <-> XYZ conversion, params.txt generation and run cleanup"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "numpy",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
xlsx = ["pandas", "openpyxl"]

[project.urls]
Homepage = "https://github.com/AaronOET/xbgears"

[tool.setuptools]
packages = ["xbgears", "xbgears.xbgen"]

[project.scripts]
xbgears = "xbgears.cli:main"
xbgears-info = "xbgears.describe:main"
xb2xyz = "xbgears.xb2xyz:main"
xyz2xb = "xbgears.xyz2xb:main"
xb2yz = "xbgears.xb2yz:main"
yz2xb = "xbgears.yz2xb:main"
xbgen = "xbgears.xbgen:main"
xbclr = "xbgears.xbclr:main"
