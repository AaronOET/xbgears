[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xbgears"
version = "0.1.0"
authors = [
    { name = "aaronchh", email = "aaronhsu219@gmail.com" },
]
description = "A collection of tools for converting between XBeach grid files and XYZ point files"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "numpy",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/AaronOET/xbgears"

[tool.setuptools]
packages = ["xbgears"]

[project.scripts]
xbgears = "xbgears.cli:main"
xbgears-info = "xbgears.describe:main"
xb2xyz = "xbgears.xb2xyz:main"
xyz2xb = "xbgears.xyz2xb:main"
